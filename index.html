<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños Kiana 💖</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at center, #3b0066, #000);
  color:white;
  text-align:center;
}

/* Texto central */
.center{
  position:relative;
  z-index:10;
}

.center h1{
  font-size:3rem;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #ff69b4; }
  to{ text-shadow:0 0 30px #ff1493, 0 0 50px #ff69b4; }
}

.center p{
  margin-top:15px;
  font-size:1.2rem;
}

/* Caritas caminando */
.loveFace{
  position:absolute;
  font-size:30px;
  animation:walk linear infinite;
}

@keyframes walk{
  from{ transform:translateX(-10vw); }
  to{ transform:translateX(110vw); }
}

/* Corazones flotando */
.heart{
  position:absolute;
  font-size:20px;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  from{ transform:translateY(100vh); opacity:1; }
  to{ transform:translateY(-10vh); opacity:0; }
}

/* Confeti */
.confetti{
  position:absolute;
  width:8px;
  height:8px;
  animation:fall linear infinite;
}

@keyframes fall{
  from{ transform:translateY(-10vh); }
  to{ transform:translateY(110vh); }
}

.tap{
  position:absolute;
  bottom:20px;
  font-size:14px;
  opacity:0.7;
}
</style>
</head>

<body>

<div class="center">
  <h1>🎂 Feliz Cumpleaños Kiana 💖</h1>
  <p>Eres mi razón de sonreír todos los días ✨</p>
  <p>Te amo infinito 💞</p>
</div>

<div class="tap">Toca la pantalla para activar la música 🎶</div>

<audio id="music" loop>
<source src="https://github.com/Gon-p/G-/raw/refs/heads/main/adore%20-%20_did%20i%20tell%20u%20that%20i%20miss%20u_%20(lyric%20video).m4a">
</audio>

<script>

/* Música */
const music=document.getElementById("music");
document.body.addEventListener("click",()=>{
  music.play();
},{once:true});

/* Caritas enamoradas */
function createLoveFace(){
  const face=document.createElement("div");
  face.classList.add("loveFace");
  face.innerHTML="😍";
  face.style.top=Math.random()*80+"vh";
  face.style.animationDuration=(Math.random()*10+5)+"s";
  document.body.appendChild(face);
  setTimeout(()=>face.remove(),15000);
}
setInterval(createLoveFace,1500);

/* Corazones flotando */
function createHeart(){
  const heart=document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML="💖";
  heart.style.left=Math.random()*100+"vw";
  heart.style.animationDuration=(Math.random()*5+3)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),8000);
}
setInterval(createHeart,500);

/* Confeti */
function createConfetti(){
  const conf=document.createElement("div");
  conf.classList.add("confetti");
  conf.style.left=Math.random()*100+"vw";
  conf.style.background=`hsl(${Math.random()*360},100%,50%)`;
  conf.style.animationDuration=(Math.random()*3+2)+"s";
  document.body.appendChild(conf);
  setTimeout(()=>conf.remove(),5000);
}
setInterval(createConfetti,200);

</script>

</body>
</html>
