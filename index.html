<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños Kiana 🎂</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(to bottom, #1a002b, #000);
  color:white;
  text-align:center;
}

/* Confeti */
.confetti{
  position:absolute;
  width:8px;
  height:8px;
  background:red;
  animation:fall 5s linear infinite;
}

@keyframes fall{
  0%{transform:translateY(-10vh);}
  100%{transform:translateY(110vh);}
}

/* Texto central */
.center{
  position:relative;
  z-index:5;
}

.center h1{
  font-size:3rem;
  text-shadow:0 0 20px #ff69b4,0 0 40px #ff1493;
  animation:pulse 2s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(1);}
  to{transform:scale(1.1);}
}

.center p{
  margin-top:15px;
  font-size:1.2rem;
}

.tap{
  position:absolute;
  bottom:20px;
  font-size:14px;
  opacity:0.7;
}
</style>
</head>

<body>

<div class="center">
  <h1>🎂 Feliz Cumpleaños Kiana 🎂</h1>
  <p>Hoy celebra el mundo porque nació alguien increíble ✨</p>
  <p>Te amo infinitamente 💖</p>
</div>

<div class="tap">Toca la pantalla para activar la música 🎶</div>

<audio id="music" loop>
<source src="https://github.com/Gon-p/G-/raw/refs/heads/main/adore%20-%20_did%20i%20tell%20u%20that%20i%20miss%20u_%20(lyric%20video).m4a">
</audio>

<script>
/* Confeti */
function createConfetti(){
  const conf=document.createElement("div");
  conf.classList.add("confetti");
  conf.style.left=Math.random()*100+"vw";
  conf.style.background=`hsl(${Math.random()*360},100%,50%)`;
  conf.style.animationDuration=(Math.random()*3+2)+"s";
  document.body.appendChild(conf);
  setTimeout(()=>conf.remove(),5000);
}
setInterval(createConfetti,200);

/* Música */
const music=document.getElementById("music");
document.body.addEventListener("click",()=>{
  music.play();
},{once:true});
</script>

</body>
</html>
